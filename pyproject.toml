[project]
name = "a-new-home"
version = "0.1.0"
description = "Amsterdam neighbourhood explorer: house price trends and livability, built with dbt and DuckDB"
requires-python = ">=3.13"
dependencies = [
    "dbt-duckdb>=1.11.1",
    "duckdb>=1.3",
    "httpx>=0.28.1",
]

[project.scripts]
ingest = "a_new_home.ingest:main"
export = "a_new_home.export:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
