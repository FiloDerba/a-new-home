version: 2

# Enforced contracts: export.py and the web app read these columns, so a renamed column or
# changed type fails the build here instead of downstream.
models:
  - name: dim_gebied
    description: The 25 current gebiedsgericht-werken areas.
    config:
      contract: {enforced: true}
    columns:
      - name: gebied_code
        data_type: varchar
        data_tests: [unique, not_null]
      - name: name
        data_type: varchar
        data_tests: [not_null]
      - name: geometry
        data_type: varchar
        data_tests: [not_null]

  - name: dim_buurt
    description: Current Amsterdam buurten with their gebied. Past years use today's boundaries.
    config:
      contract: {enforced: true}
    columns:
      - name: buurt_code
        data_type: varchar
        data_tests: [unique, not_null]
      - name: cbs_code
        data_type: varchar
      - name: name
        data_type: varchar
        data_tests: [not_null]
      - name: gebied_code
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_gebied')
                field: gebied_code
      - name: geometry
        data_type: varchar
        data_tests: [not_null]

  - name: fct_buurt_year
    description: Average WOZ value, green share and population per buurt and year.
    config:
      contract: {enforced: true}
    columns:
      - name: buurt_year_id
        data_type: varchar
        data_tests: [unique, not_null]
      - name: buurt_code
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_buurt')
                field: buurt_code
      - name: year
        data_type: integer
        data_tests: [not_null]
      - name: avg_woz_eur
        data_type: double
        description: Average WOZ value of homes in euros; null where suppressed or unavailable.
      - name: green_pct
        data_type: double
        description: Share of the area that is green, 0-100.
      - name: population
        data_type: double

  - name: fct_gebied_year
    description: Livability and safety survey scores per gebied and year.
    config:
      contract: {enforced: true}
    columns:
      - name: gebied_year_id
        data_type: varchar
        data_tests: [unique, not_null]
      - name: gebied_code
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_gebied')
                field: gebied_code
      - name: year
        data_type: integer
        data_tests: [not_null]
      - name: livability_score
        data_type: double
        description: "Survey score for 'pleasant to live in', 1-10."
      - name: safety_score
        data_type: double
        description: "Survey score for neighbourhood safety, 1-10."
